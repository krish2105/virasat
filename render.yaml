# Render blueprint for the VIRASAT API. Free tiers only.
#
# The hosted service is the officer-facing API and nothing else. The pipeline, the
# vision layer and the LangGraph agent run on the owner's machine against the same
# DATABASE_URL (ARCHITECTURE.md amendment 9) — Render's free plan cannot host a 14B
# model, and local-first inference is a design commitment, not a workaround.
#
# WARNING: a free Render Postgres instance is deleted 30 days after it is created.
# See docs/DEPLOY.md for what to do before that expiry.

databases:
  - name: virasat-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: virasat
    user: virasat

services:
  - type: web
    name: virasat-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    buildCommand: >-
      pip install uv &&
      uv pip install --system -r requirements-api.txt &&
      uv pip install --system --no-deps .
    startCommand: uvicorn virasat.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: virasat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: VIRASAT_CLOUD
        value: "0"
      # No Ollama here by design; without this /health would report "degraded" forever.
      - key: VIRASAT_API_ONLY
        value: "1"
      # Set to the Vercel origin once the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false
