[project]
name = "virasat"
version = "0.1.0"
description = "Heritage compliance and impact-assessment evidence engine for the Jaipur Walled City"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic==2.9.*",
  "pydantic-settings==2.5.*",
  "langgraph==0.2.*",
  "langgraph-checkpoint-postgres==2.0.*",
  "langchain-core==0.3.*",
  "langchain-ollama==0.2.*",
  "langchain-anthropic==0.3.*",
  "torch==2.5.*",
  "torchvision==0.20.*",
  "timm==1.0.*",
  "rasterio==1.4.*",
  "geopandas==1.0.*",
  "shapely==2.0.*",
  "pyproj==3.7.*",
  "opencv-python-headless==4.10.*",
  "numpy==1.26.*",
  "pandas==2.2.*",
  "scikit-learn==1.5.*",
  "scikit-image==0.24.*",
  "psycopg[binary]==3.2.*",
  "pgvector==0.3.*",
  "sqlalchemy==2.0.*",
  "geoalchemy2==0.15.*",
  "alembic==1.14.*",
  "structlog==24.4.*",
  "pystac-client==0.8.*",
  "rank-bm25==0.2.*",
  "sentence-transformers==3.*",
  "pymupdf==1.24.*",
  "pyjwt==2.9.*",
  "argon2-cffi==23.*",
  "reportlab==4.2.*",
  "aiosmtplib==3.*",
  "httpx==0.27.*",
  "pyyaml==6.*",
  "python-multipart==0.0.*",
]

[project.scripts]
pipeline = "virasat.ingest.pipeline:main"
eval = "virasat.eval.run:main"
agents = "virasat.agents.run:main"
digest = "virasat.notify.digest:main"
seed-admin = "virasat.db.seed:main"
label-tiles = "virasat.eval.label_tiles:main"
label-clauses = "virasat.eval.label_clauses:main"

[dependency-groups]
dev = [
  "pytest==8.3.*",
  "pytest-asyncio==0.24.*",
  "ruff==0.7.*",
  "mypy==1.13.*",
  "types-pyyaml",
  "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virasat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/virasat/db/migrations/versions/*" = ["E501", "W291"]
"tests/unit/test_chunk.py" = ["E501"]
"src/virasat/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
